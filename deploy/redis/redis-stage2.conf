# Stage 2 single-host test profile. Keep Redis on the isolated host/network.
bind 127.0.0.1
protected-mode yes
port 6379
timeout 0
tcp-keepalive 60

# Persistence does not make Pub/Sub reliable; it only preserves ordinary keys.
appendonly yes
appendfsync everysec

# Configure requirepass/ACL outside Git when authentication is needed, then set
# CHAT_REDIS_USERNAME and CHAT_REDIS_PASSWORD for both ChatServer instances.
