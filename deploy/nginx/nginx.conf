worker_processes auto;
error_log /var/log/nginx/nexusim-error.log info;
pid /run/nginx-nexusim.pid;

events {
    worker_connections 1024;
}

stream {
    log_format nexusim_stream '$remote_addr [$time_local] '
                              '$protocol status=$status '
                              'upstream=$upstream_addr '
                              'session=$session_time bytes_in=$bytes_received '
                              'bytes_out=$bytes_sent';

    access_log /var/log/nginx/nexusim-stream-access.log nexusim_stream;

    upstream nexusim_chatservers {
        # No balancing directive means round-robin per new TCP connection.
        zone nexusim_chatservers 64k;
        server 127.0.0.1:6001 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:6002 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8000;
        proxy_pass nexusim_chatservers;
        proxy_connect_timeout 3s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }
}
