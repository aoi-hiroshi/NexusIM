load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format nexusim_stream '$remote_addr [$time_local] '
                              '$protocol status=$status '
                              'upstream=$upstream_addr '
                              'session=$session_time bytes_in=$bytes_received '
                              'bytes_out=$bytes_sent';

    access_log /var/log/nginx/nexusim-stream-access.log nexusim_stream;

    upstream nexusim_chatservers {
        zone nexusim_chatservers 64k;
        server chatserver-1:6001 resolve max_fails=2 fail_timeout=10s;
        server chatserver-2:6002 resolve max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8000;
        proxy_pass nexusim_chatservers;
        proxy_connect_timeout 3s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }
}
